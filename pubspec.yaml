name: kadu
description: "Kadu: Tu asistente inteligente de alacena."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Utilidades ---
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  permission_handler: ^11.3.1

  # --- Kadu Core (Cámara & IA) ---
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0

  # --- Gestión de Estado (Riverpod) ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Generación de Código (Al mismo nivel, NO identado) ---
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true